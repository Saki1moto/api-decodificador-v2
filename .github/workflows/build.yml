name: Gerar Executavel Windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install googlenewsdecoder==0.1.7 selectolax==0.4.11 pandas openpyxl pyinstaller

    - name: Criar EXE com PyInstaller
      run: |
        pyinstaller --noconsole --onefile app_gui.py

    - name: Disponibilizar Arquivo para Download
      uses: actions/upload-artifact@v4
      with:
        name: Decodificador-Windows
        path: dist/app_gui.exe
